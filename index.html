<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory App</title>
  </head>
  <body>
    <main class="game-intro">
      <div class="landing">
        <div class="landing__title">
          <h3 class="landing__title--first">It’s play time.</h3>
          <h1 class="landing__title--second">Ready to play?</h1>
        </div>
        <button class="startBtn" type="button" id="startBtn">
          <img
            class="startBtn__icon"
            src="./assets/icons/landing-page/stadia_controller.svg"
            alt=""
          />Play
          <img
            class="startBtn__arrow"
            id="startBtn-arrow"
            src="./assets/icons/landing-page/play-arrow.svg"
            alt=""
          />
        </button>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
