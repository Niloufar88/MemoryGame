<!doctype html>
<html lang="en" data-theme="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory App</title>
  </head>
  <body>
    <div class="game-intro">
      <div class="landing">
        <div class="landing__title">
          <h3 class="landing__title--first">It’s play time.</h3>
          <h1 class="landing__title--second">Ready to play?</h1>
        </div>
        <button class="playBtn" type="button" id="playBtn">
          <img
            class="playBtn__icon"
            src="./assets/icons/landing-page/stadia_controller.svg"
            alt=""
          />Play
          <img
            class="playBtn__arrow"
            id="playBtn-arrow"
            src="./assets/icons/landing-page/play-arrow.svg"
            alt=""
          />
        </button>
      </div>
    </div>

    <div class="settings-main d-none">
      <div class="settings">
        <div class="settings__title">
          <h1 class="title">settings</h1>
          <div class="title--line">
            <img src="/assets/icons/settings/setting-line.svg" alt="" />
          </div>
        </div>

        <div class="settings__container">
          <div class="details">
            <div class="details__themes">
              <div class="details__themes--header">
                <img
                  class="themes-icon"
                  src="/public/assets/icons/settings/palette.svg"
                  alt=""
                />
                <h3 class="themes-title">Game themes</h3>
              </div>
              <div class="details__themes--options">
                <div class="options-container">
                  <input
                    type="radio"
                    id="DA"
                    name="themes"
                    value="DAProjects"
                  />
                  <label for="DA">DA Projects theme</label>
                  <img src="/assets/icons/settings/selected-line.svg" alt="" />
                </div>

                <div class="options-container">
                  <input type="radio" id="food" name="themes" value="foods" />
                  <label for="food">Foods theme</label>
                  <img src="/assets/icons/settings/selected-line.svg" alt="" />
                </div>
              </div>
            </div>
            <div class="details__player">
              <div class="details__player--header">
                <img
                  class="player-icon"
                  src="/public/assets/icons/settings/chess_pawn.svg"
                  alt=""
                />
                <h3 class="player-title">choose player</h3>
              </div>
              <div class="details__player--options">
                <div class="options-container">
                  <input
                    type="radio"
                    id="bluePlayer"
                    name="player"
                    value="blue"
                  />
                  <label for="bluePlayer">Blue</label>
                  <img src="/assets/icons/settings/selected-line.svg" alt="" />
                </div>

                <div class="options-container">
                  <input
                    type="radio"
                    id="orangePlayer"
                    name="player"
                    value="orange"
                  />
                  <label for="orangePlayer">Orange</label>
                  <img src="/assets/icons/settings/selected-line.svg" alt="" />
                </div>
              </div>
            </div>
            <div class="details__size">
              <div class="details__size--header">
                <img
                  class="size-icon"
                  src="/public/assets/icons/settings/style.svg"
                  alt=""
                />
                <h3 class="size-title">board size</h3>
              </div>
              <div class="details__size--options">
                <div class="options-container size-set">
                  <input
                    type="radio"
                    id="grid-4x4"
                    name="cards-set"
                    value="4x4"
                  />
                  <label for="grid-4x4">16 cards</label>
                  <img src="/assets/icons/settings/selected-line.svg" alt="" />
                </div>

                <div class="options-container size-set">
                  <input
                    type="radio"
                    id="grid-4x6"
                    name="cards-set"
                    value="4x6"
                  />
                  <label for="grid-4x6">24 cards</label>
                  <img src="/assets/icons/settings/selected-line.svg" alt="" />
                </div>

                <div class="options-container size-set">
                  <input
                    type="radio"
                    id="grid-6x6"
                    name="cards-set"
                    value="6x6"
                  />
                  <label for="grid-6x6">36 cards</label>
                  <img src="/assets/icons/settings/selected-line.svg" alt="" />
                </div>
              </div>
            </div>
          </div>
          <div class="UI">
            <div class="theme-img">
              <img
                src="/public/assets/icons/settings/DA-Projects-Theme Visual .svg"
                alt=""
              />
            </div>
            <div class="selected-setting">
              <span id="game-theme-text">Theme</span>
              <img src="/assets/icons/settings/line.svg" alt="" />
              <span id="player-text">Player</span>
              <img src="/assets/icons/settings/line.svg" alt="" />
              <span id="board-size-text">Board size</span>
              <button
                type="button"
                id="start-Btn"
                class="startGameBtn"
                disabled
              >
                <img
                  class="startGameBtn__icon"
                  src="/assets/icons/settings/start_display.svg"
                  alt=""
                />
                start
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="board d-none">
      <div class="board__navbar">
        <div class="board__navbar--playerFigures">
          <div class="playerFigure">
            <img src="/assets/icons/orangeFigure.svg" alt="" />
            <span
              class="playerFigure__score--orange"
              id="OScore"
              data-color="orange"
              >0</span
            >
          </div>

          <div class="playerFigure">
            <img src="/assets/icons/blueFigure.svg" alt="" />
            <span
              class="playerFigure__score--blue"
              id="BScore"
              data-color="blue"
              >0</span
            >
          </div>
        </div>
        <div class="board__navbar--currentPlayer" id="currentPlayer">
          <span class="board__navbar--currentPlayer--text"
            >Current Player:</span
          >
          <div class="board__navbar--currentPlayer--figure">
            <img src="/assets/icons/chess_pawn.svg" alt="player figure" />
          </div>
        </div>
        <div>
          <button id="exit-btn" class="exit-button" type="button">
            <img
              id="exit-svg"
              src="/assets/icons/food/exit-orange-default.svg"
              alt="exit-btn"
            />Exit game
          </button>
        </div>
      </div>

      <div class="board__main"></div>
    </div>

    <div class="gameOver"></div>

    <div class="winnerScreen">
      <div class="winner__content">
        <div class="winner__content--text">
          <h3 class="winner-title">The winner is</h3>
          <h3 class="winner"></h3>
        </div>
        <div class="winner__content--figure">
          <img src="" alt="" />
        </div>
        <button class="home-btn" type="button">Home</button>
      </div>
    </div>

    <dialog class="exitOverlay" id="overlayDialog"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
