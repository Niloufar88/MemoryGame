<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory App</title>
  </head>
  <body>
    <div class="game-intro d-none">
      <div class="landing">
        <div class="landing__title">
          <h3 class="landing__title--first">It’s play time.</h3>
          <h1 class="landing__title--second">Ready to play?</h1>
        </div>
        <button class="startBtn" type="button" id="startBtn">
          <img
            class="startBtn__icon"
            src="./assets/icons/landing-page/stadia_controller.svg"
            alt=""
          />Play
          <img
            class="startBtn__arrow"
            id="startBtn-arrow"
            src="./assets/icons/landing-page/play-arrow.svg"
            alt=""
          />
        </button>
      </div>
    </div>

    <div class="board d-none">
      <div class="board__navbar">
        <div class="board__navbar--playerFigures">
          <div class="playerFigure">
            <img class="orange" src="/assets/icons/orangeFigure.svg" alt="" />
            <span class="playerFigure__score--orange" id="OScore">0</span>
          </div>

          <div class="playerFigure">
            <img class="blue" src="/assets/icons/blueFigure.svg" alt="" />
            <span class="playerFigure__score--blue" id="BScore">0</span>
          </div>
        </div>
        <div class="board__navbar--currentPlayer" id="currentPlayer">
          Current Player:
          <img src="/assets/icons/blue-figure.svg" alt="player figure" />
        </div>
        <div>
          <button id="exit-btn" class="exit-button" type="button">
            <img src="/assets/icons/food/exit-default.svg" alt="exit-btn" />Exit
            game
          </button>
        </div>
      </div>

      <div class="board__main"></div>
    </div>

    <div class="settings-main">
      <div class="settings">
        <div class="settings__title">
          <h1 class="title">settings</h1>
          <div class="title--line">
            <img src="/assets/icons/settings/setting-line.svg" alt="" />
          </div>
        </div>

        <div class="settings__container">
          <div class="details">
            <div class="details__themes">
              <div class="details__themes--header">
                <img
                  class="themes-icon"
                  src="/public/assets/icons/settings/palette.svg"
                  alt=""
                />
                <h3 class="themes-title">Game themes</h3>
              </div>
              <div class="details__themes--options">
                <div class="options-container">
                  <input
                    type="radio"
                    id="DA"
                    name="themes"
                    value="DA-Projects"
                  />
                  <label for="DA">DA Projects theme</label>
                </div>

                <div class="options-container">
                  <input type="radio" id="food" name="themes" value="foods" />
                  <label for="food">Foods theme</label>
                </div>
              </div>
            </div>
            <div class="details__player">
              <div class="details__player--header">
                <img
                  class="player-icon"
                  src="/public/assets/icons/settings/chess_pawn.svg"
                  alt=""
                />
                <h3 class="player-title">choose player</h3>
              </div>
              <div class="details__player--options">
                <div class="options-container">
                  <input type="radio" id="blue" name="player" value="blue" />
                  <label for="blue">Blue</label>
                </div>

                <div class="options-container">
                  <input
                    type="radio"
                    id="orange"
                    name="player"
                    value="orange"
                  />
                  <label for="orange">Orange</label>
                </div>
              </div>
            </div>
            <div class="details__size">
              <div class="details__size--header">
                <img
                  class="size-icon"
                  src="/public/assets/icons/settings/style.svg"
                  alt=""
                />
                <h3 class="size-title">board size</h3>
              </div>
              <div class="details__size--options">
                <div class="options-container">
                  <input type="radio" id="4x4" name="size" value="4x4" />
                  <label for="4x4">16 cards</label>
                </div>

                <div class="options-container">
                  <input type="radio" id="4x6" name="size" value="4x6" />
                  <label for="4x6">24 cards</label>
                </div>

                <div class="options-container">
                  <input type="radio" id="6x6" name="size" value="6x6" />
                  <label for="6x6">36 cards</label>
                </div>
              </div>
            </div>
          </div>
          <div class="UI">
            <div class="theme-img">
              <img
                src="/public/assets/icons/settings/DA-Projects-Theme Visual .svg"
                alt=""
              />
            </div>
            <div class="preffered-setting">
              <span id="game-theme-text">Game theme</span>
              <img src="/assets/icons/settings/line.svg" alt="" />
              <span id="player-text">Player</span>
              <img src="/assets/icons/settings/line.svg" alt="" />
              <span id="board-size-text">Board size</span>
              <button type="button" id="start" class="start-btn" disabled>
                <img src="/assets/icons/settings/start_display.svg" alt="" />
                start
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
